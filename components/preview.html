<dialog
      class="preview-dialog"
      id="preview-dialog"
      aria-labelledby="preview-dialog-title"
    >
      <button
        class="preview-dialog__close"
        id="preview-close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>
      <span class="preview-dialog__eyebrow">IDEAL / PREVIEW</span>
      <h2 id="preview-dialog-title">Раздел в разработке</h2>
      <p id="preview-dialog-description">
        Пока мы собираем первый экран. Этот раздел подключим на следующем этапе.
      </p>
      <button class="preview-dialog__ok" type="button" id="preview-dialog-ok">
        Понятно
      </button>
    </dialog>
